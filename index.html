<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OAB Creative | Branding, Website Design & Motion Design Studio</title>
    <meta
      name="description"
      content="OAB Creative helps businesses build trust, stand out and grow through strategic branding, professional websites, motion design and digital marketing."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.oabcreativestudio.com/" />

    <!-- Open Graph / social sharing defaults. Individual routes update these
         client-side via src/seo/Seo.tsx for browsers and JS-executing
         crawlers; these static tags are the fallback seen by non-JS social
         preview bots (Facebook, Slack, LinkedIn, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OAB Creative" />
    <meta property="og:title" content="OAB Creative | Branding, Website Design & Motion Design Studio" />
    <meta
      property="og:description"
      content="OAB Creative helps businesses build trust, stand out and grow through strategic branding, professional websites, motion design and digital marketing."
    />
    <meta property="og:url" content="https://www.oabcreativestudio.com/" />
    <meta property="og:image" content="https://www.oabcreativestudio.com/og-default.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@oabcreative" />
    <meta name="twitter:title" content="OAB Creative | Branding, Website Design & Motion Design Studio" />
    <meta
      name="twitter:description"
      content="OAB Creative helps businesses build trust, stand out and grow through strategic branding, professional websites, motion design and digital marketing."
    />
    <meta name="twitter:image" content="https://www.oabcreativestudio.com/og-default.png" />

    <!-- Google Search Console (HTML tag verification method). Replace with
         your real value from search.google.com/search-console — a
         placeholder here has no effect and is safe to leave until then. -->
    <meta name="google-site-verification" content="INSERT_SEARCH_CONSOLE_VERIFICATION_CODE_HERE" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
